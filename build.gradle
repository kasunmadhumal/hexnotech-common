plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.hexnotech'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()   // publishes -sources.jar so IDEs can show javadoc
    withJavadocJar()   // publishes -javadoc.jar
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Compile-time only (not transitive to consumers) ---
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // --- API dependencies (transitive: consumers get these automatically) ---
    // Spring Web — needed for @RestControllerAdvice, ResponseEntity, etc.
    api 'org.springframework:spring-webmvc:6.2.9'

    // Spring Data Commons — needed for Page, Pageable, PageRequest
    api 'org.springframework.data:spring-data-commons:3.5.3'

    // Jakarta Persistence API — needed for @MappedSuperclass, @Column, etc.
    api 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // Jakarta Validation API — needed for custom constraint annotations
    api 'jakarta.validation:jakarta.validation-api:3.1.1'

    // Jackson — needed for JsonUtils
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.0'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ─── Publishing ───────────────────────────────────────────────────────────────
// Run: ./gradlew publishToMavenLocal
// Then in any consumer project add:
//   repositories { mavenLocal() }
//   dependencies { implementation 'com.hexnotech:hexnotech-commons:1.0.0' }
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Hexnotech Commons'
                description = 'Shared annotations, utilities, base classes and exception handlers for all Hexnotech backend services.'
                url = 'https://github.com/hexnotech/hexnotech-commons'

                licenses {
                    license {
                        name = 'Proprietary'
                    }
                }

                developers {
                    developer {
                        id = 'hexnotech'
                        name = 'Hexnotech Team'
                    }
                }
            }
        }
    }

    repositories {
        mavenLocal()
        // GitHub Packages — uncomment and set GITHUB_TOKEN env var when ready:
        // maven {
        //     name = 'GitHubPackages'
        //     url = uri('https://maven.pkg.github.com/hexnotech/hexnotech-commons')
        //     credentials {
        //         username = System.getenv('GITHUB_ACTOR')
        //         password = System.getenv('GITHUB_TOKEN')
        //     }
        // }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
