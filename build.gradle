plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hexnotech'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.5"
    }
}

dependencies {

    // Spring
    api "org.springframework.boot:spring-boot-starter-data-jpa"
    api "org.springframework.boot:spring-boot-starter-validation"
    api "org.springframework.boot:spring-boot-starter-web"

    // Jackson
    api "com.fasterxml.jackson.core:jackson-databind"
    api "com.fasterxml.jackson.core:jackson-core"

    // PDF
    implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // Lombok - compile time only
    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"

    // Tests
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.11.0'

    testCompileOnly "org.projectlombok:lombok:1.18.30"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.30"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Hexnotech Commons'
                description = 'Shared annotations, utilities, base classes and exception handlers for all Hexnotech backend services.'
                url = 'https://github.com/kasunmadhumal/hexnotech-commons'

                licenses {
                    license {
                        name = 'Proprietary'
                    }
                }

                developers {
                    developer {
                        id = 'hexnotech'
                        name = 'Hexnotech Team'
                    }
                }
            }
        }
    }

    repositories {
         mavenLocal()
         maven {
             name = 'GitHubPackages'
             url = uri('https://maven.pkg.github.com/kasunmadhumal/hexnotech-commons')
             credentials {
                 username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user') ?: ''
                 password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.token') ?: ''
             }
         }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}